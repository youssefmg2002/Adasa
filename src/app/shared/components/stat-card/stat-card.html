<div [class]="cardClasses" [style.animation-delay.ms]="animationDelay">
  <i [class]="'fa-solid ' + icon + ' text-2xl text-orange-500 mb-2 block'" aria-hidden="true"></i>
  <p class="text-2xl md:text-3xl font-bold gradient-text">{{ value }}</p>
  <p class="text-neutral-500 text-sm">{{ label }}</p>
</div>
