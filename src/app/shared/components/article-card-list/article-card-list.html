<article
  class="group card overflow-hidden"
  [style.animation-delay.ms]="animationDelay"
>
  <a [routerLink]="['/blog', article.slug]" class="flex flex-col md:flex-row">
    <div class="relative w-full md:w-72 lg:w-80 h-52 md:h-auto flex-shrink-0 overflow-hidden">
      <img [src]="article.image" [alt]="article.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
      <div class="absolute inset-0 bg-gradient-to-l from-[#161616]/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
    </div>

    <div class="flex-1 p-6 flex flex-col justify-center">
      <div class="flex flex-wrap items-center gap-3 mb-3">
        <app-category-badge [label]="article.category" variant="soft" />
        <span class="flex items-center gap-1 text-sm text-neutral-500">
          <i class="fa-regular fa-clock"></i>
          {{ article.readTime }}
        </span>
        <span class="flex items-center gap-1 text-sm text-neutral-500">
          <i class="fa-regular fa-calendar"></i>
          {{ formatDate(article.date) }}
        </span>
      </div>

      <h2 class="text-xl lg:text-2xl font-bold text-white mb-3 group-hover:text-orange-500 transition-colors duration-300 line-clamp-2">{{ article.title }}</h2>
      <p class="text-neutral-400 mb-4 line-clamp-2 leading-relaxed">{{ article.excerpt }}</p>

      <div class="flex items-center justify-between mt-auto">
        <div class="flex items-center gap-3">
          <img [src]="article.author.avatar" [alt]="article.author.name" class="w-10 h-10 rounded-full object-cover ring-2 ring-[#262626]" />
          <div>
            <p class="text-sm font-semibold text-white">{{ article.author.name }}</p>
            <p class="text-xs text-neutral-500">{{ article.author.role }}</p>
          </div>
        </div>
        <span class="hidden sm:inline-flex items-center gap-2 text-orange-500 font-semibold text-sm group-hover:gap-3 transition-all duration-300">
          اقرأ المقال
          <i class="fa-solid fa-arrow-left"></i>
        </span>
      </div>
    </div>
  </a>
</article>
