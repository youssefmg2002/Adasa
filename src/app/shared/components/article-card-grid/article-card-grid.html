<article class="group card overflow-hidden" [style.animation-delay.ms]="animationDelay">
  <a [routerLink]="['/blog', article.slug]" class="block">
    <div class="relative h-52 overflow-hidden">
      <img [src]="article.image" [alt]="article.title" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out" />
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
      <div class="absolute top-4 right-4">
        <app-category-badge [label]="article.category" variant="dark" />
      </div>
    </div>

    <div class="p-6">
      <div class="flex items-center gap-3 text-sm text-neutral-500 mb-3">
        <span class="flex items-center gap-1">
          <i class="fa-regular fa-clock"></i>
          {{ article.readTime }}
        </span>
        <span class="w-1 h-1 bg-neutral-600 rounded-full"></span>
        <span>{{ formatDate(article.date) }}</span>
      </div>

      <h3 class="text-xl font-bold text-white mb-3 group-hover:text-orange-500 transition-colors duration-300 line-clamp-2 leading-tight">{{ article.title }}</h3>
      <p class="text-neutral-400 mb-5 line-clamp-2 text-sm leading-relaxed">{{ article.excerpt }}</p>

      <div class="flex items-center justify-between pt-4 border-t border-[#262626]">
        <div class="flex items-center gap-3">
          <img [src]="article.author.avatar" [alt]="article.author.name" class="w-9 h-9 rounded-full object-cover ring-2 ring-[#262626]" />
          <div>
            <p class="text-sm font-medium text-white">{{ article.author.name }}</p>
            <p class="text-xs text-neutral-500">{{ article.author.role }}</p>
          </div>
        </div>
        <div class="w-8 h-8 rounded-full bg-orange-500/10 flex items-center justify-center group-hover:bg-orange-500 transition-colors duration-300 border border-orange-500/20 group-hover:border-transparent">
          <i class="fa-solid fa-chevron-left text-xs text-orange-500 group-hover:text-white transition-colors duration-300"></i>
        </div>
      </div>
    </div>
  </a>
</article>
