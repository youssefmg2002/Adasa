<div class="group card p-6 text-center">
  <div class="relative inline-block mb-4">
    <img
      [src]="member.avatar"
      [alt]="member.name"
      class="w-24 h-24 rounded-full object-cover ring-4 ring-[#262626] group-hover:ring-orange-500/30 transition-all"
    />
    <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-orange-500 rounded-full border-2 border-[#161616] flex items-center justify-center">
      <i class="fa-solid fa-check text-white text-xs"></i>
    </div>
  </div>

  <h3 class="font-bold text-white text-lg">{{ member.name }}</h3>
  <p class="text-orange-500 text-sm font-medium mb-4">{{ member.role }}</p>

  <div class="flex justify-center gap-3">
    <a [routerLink]="[]" class="w-9 h-9 bg-[#262626] rounded-lg flex items-center justify-center text-neutral-500 hover:bg-orange-500 hover:text-white transition-colors">
      <i class="fa-brands fa-x-twitter text-sm"></i>
    </a>
    <a [routerLink]="[]" class="w-9 h-9 bg-[#262626] rounded-lg flex items-center justify-center text-neutral-500 hover:bg-neutral-700 hover:text-white transition-colors">
      <i class="fa-brands fa-github text-sm"></i>
    </a>
    <a [routerLink]="[]" class="w-9 h-9 bg-[#262626] rounded-lg flex items-center justify-center text-neutral-500 hover:bg-blue-600 hover:text-white transition-colors">
      <i class="fa-brands fa-linkedin-in text-sm"></i>
    </a>
  </div>
</div>
