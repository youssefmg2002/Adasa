<a
  [routerLink]="['/blog', article.slug]"
  class="group relative block bg-[#111111] rounded-2xl overflow-hidden border border-[#262626] hover:border-orange-500/30 transition-all duration-500"
>
  <div class="relative h-48 overflow-hidden">
    <img [src]="article.image" [alt]="article.title" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
    <div class="absolute inset-0 bg-linear-to-t from-[#111111] to-transparent"></div>
    <span class="absolute top-4 right-4 px-3 py-1 bg-orange-500 text-white text-xs font-bold rounded-full">{{ article.category }}</span>
  </div>

  <div class="p-5">
    <h3 class="font-bold text-white group-hover:text-orange-500 transition-colors line-clamp-2 mb-3">{{ article.title }}</h3>
    <div class="flex items-center justify-between text-sm text-neutral-500">
      <span class="flex items-center gap-2">
        <img [src]="article.author.avatar" [alt]="article.author.name" class="w-6 h-6 rounded-full" />
        {{ article.author.name }}
      </span>
      <span>{{ article.readTime }}</span>
    </div>
  </div>
</a>
