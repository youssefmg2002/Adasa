<section class="py-20 bg-[#111111] border-y border-[#262626]">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-16">
      <h2 class="text-3xl md:text-4xl font-bold text-white mb-4 flex items-center justify-center gap-3">
        <span class="w-1.5 h-8 bg-gradient-to-b from-orange-500 to-yellow-500 rounded-full"></span>
        قيمنا
        <span class="w-1.5 h-8 bg-gradient-to-b from-yellow-500 to-orange-500 rounded-full"></span>
      </h2>
      <p class="text-lg text-neutral-400 max-w-2xl mx-auto">المبادئ التي توجه كل ما نقوم بإنشائه</p>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (value of values; track value.title) {
        <div class="group card p-6 text-center relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-br from-orange-500 to-yellow-500 opacity-0 group-hover:opacity-10 transition-opacity duration-300"></div>
          <div class="relative">
            <i [class]="'fa-solid ' + value.icon + ' text-4xl text-orange-500 mb-4 block'" aria-hidden="true"></i>
            <h3 class="text-lg font-bold text-white mb-2 group-hover:text-orange-500 transition-colors">{{ value.title }}</h3>
            <p class="text-neutral-400 text-sm">{{ value.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
