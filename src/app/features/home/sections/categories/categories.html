<section class="py-24 bg-[#111111] relative border-y border-[#262626]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-12">
      <app-section-badge label="التصنيفات" />
      <h2 class="section-title text-white">استكشف حسب الموضوع</h2>
      <p class="section-subtitle max-w-lg mx-auto">اعثر على محتوى مصمم حسب اهتماماتك</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
      @for (cat of categoriesWithIcons; track cat.name; let i = $index) {
        <a
          [routerLink]="'/blog'"
          [queryParams]="{ category: cat.name }"
          class="group relative block p-6 rounded-2xl bg-[#161616] border border-[#262626] overflow-hidden hover:border-orange-500/30 transition-all duration-500 hover:-translate-y-1"
          [style.animation-delay.ms]="i * 100"
        >
          <div class="absolute inset-0 bg-gradient-to-br from-orange-500 to-yellow-500 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

          <div class="relative z-10">
            <div class="w-12 h-12 bg-orange-500/10 rounded-xl flex items-center justify-center mb-4 group-hover:bg-white/20 transition-colors duration-300 border border-orange-500/20 group-hover:border-transparent">
              @switch (cat.icon) {
                @case ('sun') {
                  <i class="w-5 h-5 text-orange-500 group-hover:text-white transition-colors duration-300 fa-solid fa-sun" aria-hidden="true"></i>
                }
                @case ('user') {
                  <i class="w-5 h-5 text-orange-500 group-hover:text-white transition-colors duration-300 fa-solid fa-user" aria-hidden="true"></i>
                }
                @case ('mountain') {
                  <i class="w-5 h-5 text-orange-500 group-hover:text-white transition-colors duration-300 fa-solid fa-mountain-sun" aria-hidden="true"></i>
                }
                @case ('sliders') {
                  <i class="w-5 h-5 text-orange-500 group-hover:text-white transition-colors duration-300 fa-solid fa-sliders" aria-hidden="true"></i>
                }
              }
            </div>

            <h3 class="font-bold text-lg text-white group-hover:text-white transition-colors duration-300 mb-1">{{ cat.name }}</h3>
            <p class="text-sm text-neutral-500 group-hover:text-white/80 transition-colors duration-300">{{ cat.count }} مقالة</p>

            <div class="absolute top-6 left-6 w-8 h-8 rounded-full bg-[#262626] flex items-center justify-center opacity-0 group-hover:opacity-100 group-hover:bg-white/20 transition-all duration-300">
              <i class="w-4 h-4 text-white rotate-180 fa-solid fa-arrow-right" aria-hidden="true"></i>
            </div>
          </div>
        </a>
      }
    </div>
  </div>
</section>
