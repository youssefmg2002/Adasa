<section class="py-24 bg-[#0a0a0a] relative overflow-hidden">
  <div class="absolute bottom-0 left-0 w-1/3 h-full bg-linear-to-r from-orange-500/5 to-transparent"></div>

  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-4">
      <div>
        <app-section-badge label="الأحدث" />
        <h2 class="section-title text-white">أحدث المقالات</h2>
        <p class="section-subtitle max-w-lg">محتوى جديد طازج من المطبعة</p>
      </div>
      <a routerLink="/blog" class="group inline-flex items-center gap-2 text-orange-500 font-semibold hover:text-orange-400 transition-colors">
        عرض جميع المقالات
        <i class="w-5 h-5 group-hover:-translate-x-1 transition-transform rotate-180 fa-solid fa-arrow-right-long" aria-hidden="true"></i>
      </a>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
  @for (article of articles; track article.slug; let i = $index) {
    <app-article-card-grid [article]="article" [animationDelay]="i * 100" />
  }
</div>
  </div>
</section>
