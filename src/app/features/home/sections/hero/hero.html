<section class="relative min-h-[90vh] flex items-center overflow-hidden bg-[#0a0a0a]">

  <div class="absolute inset-0 bg-[linear-gradient(rgba(38,38,38,0.5)_1px,transparent_1px),linear-gradient(90deg,rgba(38,38,38,0.5)_1px,transparent_1px)] bg-size-[60px_60px]"></div>

  <div class="absolute top-20 left-10 w-72 h-72 bg-orange-500/10 rounded-full blur-3xl blob"></div>
  <div class="absolute bottom-20 right-10 w-96 h-96 bg-yellow-500/5 rounded-full blur-3xl blob" style="animation-delay: -2s;"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-125 h-125 bg-orange-500/5 rounded-full blur-3xl"></div>

  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
    <div class="text-center max-w-4xl mx-auto">

      <div class="section-header inline-flex items-center gap-2 mb-8 animate-fade-in ">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-500 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
        </span>
        <span class="text-sm font-medium text-neutral-300">مرحباً بك في عدسة</span>
      </div>

      <h1 class="text-5xl md:text-6xl lg:text-7xl font-bold text-white mb-6 leading-tight tracking-tight">
        اكتشف <span class="gradient-text">فن</span><br>التصوير الفوتوغرافي
      </h1>

      <p class="text-xl md:text-2xl text-neutral-400 mb-10 max-w-2xl mx-auto leading-relaxed">
        انغمس في أسرار المحترفين ونصائح عملية لتطوير مهاراتك في التصوير.
      </p>

      <div class="flex flex-col sm:flex-row justify-center gap-4 mb-16">
        <a routerLink="/blog" class="btn-primary inline-flex items-center justify-center gap-2 group">
          <span>استكشف المقالات</span>
          <i class="w-5 h-5 group-hover:-translate-x-1 transition-transform rotate-180 fa-solid fa-arrow-right-long" aria-hidden="true"></i>
        </a>
        <a routerLink="/about" class="btn-secondary inline-flex items-center justify-center gap-2">
          <span class="w-3 h-3 text-[8px] fa-stack" aria-hidden="true">
            <i class="fa-regular fa-circle fa-stack-2x"></i>
            <i class="fa-solid fa-info fa-stack-1x"></i>
          </span>
          <span>اعرف المزيد</span>
        </a>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-3xl mx-auto">
        @for (stat of heroStats; track stat.label) {
          <app-stat-card [icon]="stat.icon" [value]="stat.value" [label]="stat.label" [animationDelay]="stat.delay" />
        }
      </div>

    </div>
  </div>
</section>
