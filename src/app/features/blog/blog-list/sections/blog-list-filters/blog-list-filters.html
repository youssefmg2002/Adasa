<section aria-label="بحث وتصنيف المقالات" class="sticky top-20 z-40 bg-[#0a0a0a]/90 backdrop-blur-xl border-b border-[#262626]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="relative w-full md:w-80">
        <input
          type="text"
          placeholder="ابحث في المقالات..."
          aria-label="ابحث في المقالات"
          class="input-dark w-full px-5 py-3 pr-12"
          [value]="searchTerm"
          (input)="onSearchInput($event)"
        />
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500" aria-hidden="true"></i>
      </div>

      <div class="flex flex-wrap justify-center gap-2">
        <button
          type="button"
          [class]="selectedCategory === allCategoriesLabel ? activeFilterClass : inactiveFilterClass"
          (click)="categoryChange.emit(allCategoriesLabel)"
        >
          {{ allCategoriesLabel }}
        </button>

        @for (category of categoryNames; track category) {
          <button
            type="button"
            [class]="selectedCategory === category ? activeFilterClass : inactiveFilterClass"
            (click)="categoryChange.emit(category)"
          >
            {{ category }}
          </button>
        }
      </div>
    </div>
  </div>
</section>
