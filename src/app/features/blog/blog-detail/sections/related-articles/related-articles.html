@if (articles.length > 0) {
  <section class="mt-20 pt-12 border-t border-[#262626]">
    <div class="flex items-center justify-between mb-10">
      <div class="flex items-center gap-4">
        <span class="w-12 h-12 bg-orange-500/10 rounded-2xl flex items-center justify-center border border-orange-500/30">
          <i class="fa-solid fa-images text-orange-500 text-xl" aria-hidden="true"></i>
        </span>
        <div>
          <h2 class="text-2xl font-bold text-white">مقالات قد تعجبك</h2>
          <p class="text-neutral-500 text-sm">استكشف المزيد من المحتوى المميز</p>
        </div>
      </div>
      <a routerLink="/blog" class="hidden sm:flex items-center gap-2 text-orange-500 hover:text-orange-400 transition-colors group">
        عرض الكل
        <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform" aria-hidden="true"></i>
      </a>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (related of articles; track related.slug) {
        <app-article-card-compact [article]="related" />
      }
    </div>
  </section>
}
